
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz de Russo A1</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Times New Roman", Times, serif;
    background: #f8f7f2;
    color: #263449;
    line-height: 1.6;
    padding: 45px 8%;
}

.container {
    max-width: 800px;
    margin: 0 auto;
}

.header {
    margin-bottom: 35px;
    border-bottom: 2px solid #a68b4e;
    padding-bottom: 25px;
}

.small-heading {
    color: #a68b4e;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

h1 {
    font-size: 36px;
    font-weight: normal;
    margin-bottom: 10px;
}

.intro {
    color: #77766e;
    font-size: 18px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    color: #77766e;
    font-size: 15px;
    margin-bottom: 10px;
}

.progress-bar {
    height: 5px;
    background: #e5e2d8;
    margin-bottom: 30px;
}

.progress-fill {
    height: 5px;
    width: 0%;
    background: #65724e;
    transition: width 0.3s;
}

.quiz-card {
    background: #ffffff;
    border: 1px solid #dedbd0;
    border-top: 3px solid #a68b4e;
    padding: 35px;
}

.question-number {
    color: #a68b4e;
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 18px;
}

.question {
    font-size: 25px;
    font-weight: normal;
    margin-bottom: 12px;
}

.translation {
    color: #77766e;
    font-size: 16px;
    margin-bottom: 28px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    background: #f8f7f2;
    border: 1px solid #dedbd0;
    padding: 15px 18px;
    text-align: left;
    font-family: "Times New Roman", Times, serif;
    font-size: 18px;
    color: #263449;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover:not(:disabled) {
    border-color: #65724e;
    background: #f0f0e9;
}

.answer:disabled {
    cursor: default;
}

.answer.correct {
    background: #e8eee3;
    border-color: #65724e;
    color: #405334;
}

.answer.incorrect {
    background: #f4e9e5;
    border-color: #a66b5e;
    color: #874c40;
}

.feedback {
    margin-top: 20px;
    font-size: 17px;
    min-height: 28px;
    color: #526044;
}

.next-button {
    display: none;
    margin-top: 25px;
    padding: 12px 25px;
    background: #526044;
    color: white;
    border: none;
    font-family: "Times New Roman", Times, serif;
    font-size: 17px;
    cursor: pointer;
}

.next-button:hover {
    background: #3d4a32;
}

.result {
    display: none;
    text-align: center;
    background: white;
    border: 1px solid #dedbd0;
    border-top: 3px solid #a68b4e;
    padding: 40px 25px;
}

.result h2 {
    font-size: 30px;
    font-weight: normal;
    margin-bottom: 15px;
}

.stars {
    color: #a68b4e;
    font-size: 38px;
    letter-spacing: 5px;
    margin: 20px 0;
}

.score {
    font-size: 22px;
    margin-bottom: 15px;
}

.result-message {
    color: #77766e;
    font-size: 18px;
    margin-bottom: 25px;
}

.restart-button {
    background: #526044;
    color: white;
    border: none;
    padding: 13px 28px;
    font-family: "Times New Roman", Times, serif;
    font-size: 17px;
    cursor: pointer;
}

.restart-button:hover {
    background: #3d4a32;
}

.back-link {
    display: inline-block;
    margin-top: 30px;
    color: #526044;
    text-decoration: none;
    border-bottom: 1px solid #a68b4e;
    padding-bottom: 3px;
    font-size: 16px;
}

footer {
    text-align: center;
    color: #77766e;
    margin-top: 45px;
    font-size: 14px;
}

@media (max-width: 600px) {
    body {
        padding: 30px 18px;
    }

    .quiz-card {
        padding: 23px;
    }

    h1 {
        font-size: 30px;
    }

    .question {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="small-heading">Russo · Nível Elementar</div>

        <h1>Quiz de Russo A1</h1>

        <p class="intro">
            Testa os teus conhecimentos de vocabulário,
            gramática e expressões básicas em russo.
        </p>
    </header>

    <div id="quiz">

        <div class="progress-info">
            <span id="question-counter">Pergunta 1 de 15</span>
            <span id="score-counter">Pontuação: 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="quiz-card">

            <div class="question-number" id="question-label">
                PERGUNTA 01
            </div>

            <h2 class="question" id="question"></h2>

            <p class="translation" id="translation"></p>

            <div class="answers" id="answers"></div>

            <div class="feedback" id="feedback"></div>

            <button class="next-button" id="next-button"
                onclick="nextQuestion()">
                Próxima pergunta →
            </button>

        </div>

    </div>

    <div class="result" id="result">

        <div class="small-heading">Russo · A1</div>

        <h2>Quiz concluído!</h2>

        <div class="stars" id="stars"></div>

        <div class="score" id="final-score"></div>

        <p class="result-message" id="result-message"></p>

        <button class="restart-button" onclick="restartQuiz()">
            Repetir o quiz
        </button>

    </div>

    <a class="back-link" href="/russo/quizzes/">
        ← Voltar aos quizzes de russo
    </a>

    <footer>
        A Biblioteca da Professora Daria
    </footer>

</div>

<script>

const questions = [

{
    question: 'O que significa «Привет»?',
    translation: 'Escolhe a tradução correta.',
    answers: ['Adeus', 'Olá', 'Obrigado'],
    correct: 1,
    explanation: 'Привет significa Olá. É uma saudação informal.'
},

{
    question: 'O que significa «Как тебя зовут?»?',
    translation: 'Как тебя зовут?',
    answers: [
        'Quantos anos tens?',
        'De onde és?',
        'Como te chamas?'
    ],
    correct: 2,
    explanation: 'Как тебя зовут? significa Como te chamas?'
},

{
    question: 'Completa a frase: Меня ___ Анна.',
    translation: 'Chamo-me Ana.',
    answers: ['зовут', 'живёт', 'говорю'],
    correct: 0,
    explanation: 'Меня зовут Анна significa Chamo-me Ana.'
},

{
    question: 'Escolhe a opção correta: Это ___ книга.',
    translation: 'Este é o meu livro.',
    answers: ['мой', 'моя', 'моё'],
    correct: 1,
    explanation: 'Книга é um nome feminino. Por isso, utilizamos моя.'
},

{
    question: 'Completa a frase: Он ___ студент.',
    translation: 'Ele é estudante.',
    answers: ['есть', 'быть', '—'],
    correct: 2,
    explanation: 'Em frases simples no presente, o verbo ser (быть) é normalmente omitido em russo.'
},

{
    question: 'Como se diz «Sou de Portugal» em russo?',
    translation: 'Escolhe a frase correta.',
    answers: [
        'Я из Португалии.',
        'Я в Португалии.',
        'Ты из Португалии.'
    ],
    correct: 0,
    explanation: 'Я из Португалии significa Sou de Portugal.'
},

{
    question: 'Que número corresponde a «семь»?',
    translation: 'Escolhe a resposta correta.',
    answers: ['Cinco (5)', 'Sete (7)', 'Nove (9)'],
    correct: 1,
    explanation: 'Семь significa sete.'
},

{
    question: 'O que significa «Где?»?',
    translation: 'Escolhe a tradução correta.',
    answers: ['Quando?', 'Quem?', 'Onde?'],
    correct: 2,
    explanation: 'Где? significa Onde?'
},

{
    question: 'Completa a frase: Я говорю ___-русски.',
    translation: 'Eu falo russo.',
    answers: ['на', 'по', 'в'],
    correct: 1,
    explanation: 'A expressão correta é говорить по-русски, que significa falar russo.'
},

{
    question: 'Completa a frase: У меня ___ брат.',
    translation: 'Tenho um irmão.',
    answers: ['есть', 'быть', 'имею'],
    correct: 0,
    explanation: 'У меня есть брат é a expressão habitual para dizer Tenho um irmão.'
},

{
    question: 'O que significa «Кто это?»?',
    translation: 'Escolhe a tradução correta.',
    answers: ['Quem é?', 'O que é?', 'Onde está?'],
    correct: 0,
    explanation: 'Кто это? significa Quem é?'
},

{
    question: 'Que dia da semana significa «понедельник»?',
    translation: 'Escolhe a resposta correta.',
    answers: ['Sexta-feira', 'Segunda-feira', 'Domingo'],
    correct: 1,
    explanation: 'Понедельник significa segunda-feira.'
},

{
    question: 'Completa a frase: Она живёт ___ Москве.',
    translation: 'Ela vive em Moscovo.',
    answers: ['на', 'из', 'в'],
    correct: 2,
    explanation: 'Utilizamos в Москве para dizer em Moscovo.'
},

{
    question: 'Completa a frase: Я хочу ___ .',
    translation: 'Quero chá.',
    answers: ['чай', 'чаям', 'чае'],
    correct: 0,
    explanation: 'Я хочу чай significa Quero chá. Neste contexto, utilizamos чай.'
},

{
    question: 'Qual é a resposta adequada a «Спасибо»?',
    translation: 'Alguém agradece-te. O que respondes?',
    answers: ['Пожалуйста', 'До свидания', 'Доброе утро'],
    correct: 0,
    explanation: 'Пожалуйста significa De nada.'
}

];

let currentQuestion = 0;
let score = 0;
let answered = false;

function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById('question-counter').textContent =
        `Pergunta ${currentQuestion + 1} de ${questions.length}`;

    document.getElementById('score-counter').textContent =
        `Pontuação: ${score}`;

    document.getElementById('question-label').textContent =
        `PERGUNTA ${String(currentQuestion + 1).padStart(2, '0')}`;

    document.getElementById('question').textContent = q.question;

    document.getElementById('translation').textContent = q.translation;

    document.getElementById('progress').style.width =
        (currentQuestion / questions.length * 100) + '%';

    document.getElementById('feedback').textContent = '';

    document.getElementById('next-button').style.display = 'none';

    const answersContainer = document.getElementById('answers');

    answersContainer.innerHTML = '';

    q.answers.forEach((answer, index) => {

        const button = document.createElement('button');

        button.className = 'answer';

        button.textContent = answer;

        button.onclick = () => selectAnswer(index);

        answersContainer.appendChild(button);

    });

}

function selectAnswer(index) {

    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const buttons = document.querySelectorAll('.answer');

    buttons.forEach((button, i) => {

        button.disabled = true;

        if (i === q.correct) {
            button.classList.add('correct');
        }

        if (i === index && index !== q.correct) {
            button.classList.add('incorrect');
        }

    });

    const feedback = document.getElementById('feedback');

    if (index === q.correct) {

        score++;

        feedback.textContent = '✓ Correto! ' + q.explanation;

    } else {

        feedback.textContent = 'Não é bem assim. ' + q.explanation;

    }

    document.getElementById('score-counter').textContent =
        `Pontuação: ${score}`;

    const nextButton = document.getElementById('next-button');

    nextButton.textContent =
        currentQuestion === questions.length - 1
        ? 'Ver resultados →'
        : 'Próxima pergunta →';

    nextButton.style.display = 'inline-block';

}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        loadQuestion();

    } else {

        showResults();

    }

}

function showResults() {

    document.getElementById('quiz').style.display = 'none';

    document.getElementById('result').style.display = 'block';

    document.getElementById('progress').style.width = '100%';

    document.getElementById('final-score').textContent =
        `Acertaste ${score} em ${questions.length} perguntas!`;

    let stars;
    let message;

    if (score === 15) {

        stars = '★★★★★';
        message = 'Excelente! Respondeste corretamente a todas as perguntas. Tens uma ótima base de russo A1!';

    } else if (score >= 8) {

        stars = '★★★☆☆';
        message = 'Muito bem! Já tens algumas bases de russo. Continua a praticar o vocabulário e a gramática.';

    } else {

        stars = '★☆☆☆☆';
        message = 'Não desistas! Aprender uma língua nova exige prática. Revê os conteúdos básicos e tenta novamente!';

    }

    document.getElementById('stars').textContent = stars;

    document.getElementById('result-message').textContent = message;

}

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById('quiz').style.display = 'block';

    document.getElementById('result').style.display = 'none';

    loadQuestion();

}

loadQuestion();

</script>

</body>
</html>
