#bz .in{background:var(--iv);border:2px solid #5b7a9a;max-width:560px;width:100%;max-height:92%;overflow:auto;padding:16px;position:relative}

#bz .box{display:flow-root}

#bz .tr,#bz .ch,#bz .nt{animation:f .5s both}

#bz .mo{transform-box:fill-box;transform-origin:center;animation:mo .22s alternate}
@keyframes mo{to{transform:scaleY(3.2)}}
#bz .bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}
#bz .fl{animation:fl 9s infinite}
@keyframes fl{0%,92%,96%,100%{opacity:0}93%{opacity:.4}94%{opacity:.05}95%{opacity:.35}}
#bz .rn{animation:rn .5s linear infinite}
@keyframes rn{to{transform:translate(-8px,28px)}}
#bz .o:hover svg{filter:drop-shadow(0 0 5px #b83250)}
#bz .sc>svg{animation:f .6s}
</style>

const C={bilhete:["Bilhete: «Encontro à meia-noite no jardim. — V.»","Note: 'Meeting at midnight in the garden. — V.'","Записка: «Встреча в полночь в саду. — V.»"],luva:["Uma luva verde na biblioteca","A green glove in the library","Зелёная перчатка в библиотеке"],lama:["Pegadas de lama do jardim","Muddy footprints in the garden","Грязные следы в саду"],ines:["A Inês viu o Dr. Vasco com pressa","Inês saw Dr Vasco in a hurry","Инеш видела доктора Васко спешащим"],emily:["A Emily viu um homem com luvas verdes","Emily saw a man with green gloves","Эмили видела мужчину в зелёных перчатках"]};
const R={
hall:{n:"Hall",d:["Estás no hall. A casa tem cinco janelas grandes.","You are in the hall. The house has five big windows.","Ты в холле. В доме пять больших окон."],p:["amelia"],o:[
[60,290,130,70,'#c9703f','mesa',["Há um bilhete na mesa: «Encontro à meia-noite no jardim. — V.»","There is a note on the table: 'Meeting at midnight in the garden. — V.'","На столе записка: «Встреча в полночь в саду. — V.»"],'bilhete'],
[250,200,40,160,'#a8483c','relógio',["O relógio parou às dez e vinte.","The clock stopped at twenty past ten.","Часы остановились в десять двадцать."],'hora'],
[400,190,80,100,'#b83250','retrato',["Um retrato do Senhor Duarte. Ele parece triste.","A portrait of Mr Duarte. He looks sad.","Портрет господина Дуарте. Он выглядит грустным."]]]},
biblioteca:{n:"Biblioteca",d:["Estás na biblioteca. Há muitos livros e uma secretária.","You are in the library. There are many books and a desk.","Ты в библиотеке. Здесь много книг и письменный стол."],p:["tomas","vasco"],o:[
[80,270,180,70,'#a8483c','secretária',["Na secretária há um testamento novo: a casa vai para uma escola! O caderno não está aqui.","On the desk there is a new will: the house goes to a school! The notebook is not here.","На столе новое завещание: дом достанется школе! Тетради здесь нет."],'testamento'],
[300,318,80,64,'#4f7a4a','luva',["Uma luva verde debaixo da cadeira. O tecido está seco, apesar da chuva.","A green glove under the chair!","Зелёная перчатка под стулом!"],'luva'],
[420,230,110,120,'#5b4a6b','lareira',["A lareira está fria. Há papel queimado e um pedaço de envelope com a inicial A.","The fireplace is cold. There is burnt paper.","Камин холодный. Там сожжённая бумага."],'papeis']]},
cozinha:{n:"Cozinha",d:["Estás na cozinha. Cheira a chá e a pão.","You are in the kitchen. It smells of tea and bread.","Ты на кухне. Пахнет чаем и хлебом."],p:["ines"],o:[
[95,55,120,110,'#9db6bf','janela',["A janela está aberta. Há lama no chão, mas também marcas de água junto ao parapeito.","The window is open. There is mud on the floor.","Окно открыто. На полу грязь."]],
[300,270,150,70,'#c9703f','mesa',["Uma chávena de chá. Está fria.","A cup of tea. It is cold.","Чашка чая. Он холодный."]],
[500,160,60,60,'#8a8a85','panela',["Uma panela grande. Está vazia.","A big pot. It is empty.","Большая кастрюля. Она пустая."]]]},

[80,310,180,75,'#a8483c','pegadas',["Pegadas grandes de lama! Algumas vêm do jardim; outras parecem seguir na direção contrária. A chuva apagou parte do desenho.","Big muddy footprints! They go from the window to the gate.","Большие грязные следы! Они ведут от окна к воротам."],'lama'],
[330,290,130,50,'#c9703f','banco',["Um banco velho. Está molhado.","An old bench. It is wet.","Старая скамейка. Она мокрая."]],
[500,230,90,110,'#a8a89a','fonte',["Uma fonte antiga. Dentro da água há uma chave pequena, presa a um fio azul.","An old fountain. There is a small key in the water!","Старинный фонтан. В воде маленький ключ!"],'chave']]}};
const T=(a,b,c)=>[a,b,c],OK=["Obrigado.","Thank you.","Спасибо.",-1];
const D={
amelia:{0:{s:T("Boa noite, detetive. O caderno do meu marido desapareceu. Ajude-nos, por favor.","Good evening, detective. My husband's notebook has disappeared. Please help us.","Добрый вечер, детектив. Тетрадь моего мужа пропала. Помогите нам, пожалуйста."),o:[["Onde estava o caderno?","Where was the notebook?","Где была тетрадь?",1],["Quem está em casa?","Who is in the house?","Кто в доме?",2]]},
1:{s:T("Estava na biblioteca, na secretária. Mas, nessa noite, entrei lá apenas uma vez. Não toquei no caderno.","It was in the library, on the desk. Nobody saw anything.","Она была в библиотеке, на столе. Никто ничего не видел."),o:[["Quem está em casa?","Who is in the house?","Кто в доме?",2],OK]},
2:{s:T("Estamos cinco: eu, o Tomás, a Inês, o Dr. Vasco e a Emily. E, claro, o meu marido. Não confio em nenhuma das versões desta noite.","There are five of us: me, Tomás, Inês, Dr Vasco and Emily. The doctor is very nervous.","Нас пятеро: я, Томаш, Инеш, доктор Васко и Эмили. Доктор очень нервничает."),o:[OK]}},
tomas:{0:{s:T("Boa noite. Às dez servi o chá na sala. Depois fui à adega buscar uma garrafa. Não contei isto antes porque não devia lá estar.","Good evening. At ten o'clock I served tea in the lounge. Then I went to the corridor.","Добрый вечер. В десять часов я подал чай в гостиной. Потом пошёл в коридор."),o:[["Viu alguém no jardim?","Did you see anyone in the garden?","Вы видели кого-то в саду?",1],["Gosta do Senhor Duarte?","Do you like Mr Duarte?","Вам нравится господин Дуарте?",2]]},
1:{s:T("Não vi ninguém. Mas ouvi a porta da cozinha e passos no corredor. Pensei que fosse a Inês.","I didn't see anyone. But the kitchen door was open.","Я никого не видел. Но дверь кухни была открыта."),o:[OK]},
2:{s:T("Trabalho aqui há vinte anos. Ele prometeu deixar-me ficar na casa, mas mudou de ideias. Não queria que a carta de despedimento fosse encontrada.","Yes. I have worked here for twenty years. He is like a father.","Да. Я работаю здесь двадцать лет. Он как отец."),o:[["Viu alguém no jardim?","Did you see anyone in the garden?","Вы видели кого-то в саду?",1]]}},
vasco:{0:{s:T("Boa noite. Estava no quarto a ler. Saí por alguns minutos, mas não fui ao jardim. Não tenho razão para explicar mais.","Good evening. I was in my room reading. I know nothing about the notebook.","Добрый вечер. Я читал в своей комнате. Я ничего не знаю о тетради."),o:[["Onde estão as suas luvas?","Where are your gloves?","Где ваши перчатки?",1],["Está nervoso?","Are you nervous?","Вы нервничаете?",2]]},
1:{s:T("As minhas luvas? Não são minhas. Ou melhor... já foram. Dei um par a alguém há semanas. Não me lembro a quem.","My gloves? I... I don't have gloves. I have to go!","Мои перчатки? Я... у меня нет перчаток. Мне пора!"),o:[OK]},
2:{s:T("Estou cansado, sim. O Senhor Duarte pediu-me para preparar um medicamento, mas não fui eu que lhe levei o chá.","No! I'm just tired. It's a horrible night.","Нет! Я просто устал. Ужасная ночь."),o:[["Onde estão as suas luvas?","Where are your gloves?","Где ваши перчатки?",1]]}},
ines:{0:{s:T("Boa noite. Estou a fazer chá. A Inês conhece todos os frascos da cozinha, mas isso não significa que saiba o que havia dentro deles.","Good evening. I'm making tea. I'm afraid of this night!","Добрый вечер. Я завариваю чай. Мне страшно этой ночью!"),o:[["Viu alguma coisa?","Did you see anything?","Вы что-нибудь видели?",1],["Gosta de cozinhar?","Do you like cooking?","Вы любите готовить?",2]]},
1:{c:'ines',s:T("Vi uma pessoa no corredor às dez e meia. Parecia o Dr. Vasco, mas estava escuro e a pessoa levava um casaco largo.","I saw Dr Vasco in the corridor at half past ten. He was in a hurry.","Я видела доктора Васко в коридоре в половине одиннадцатого. Он торопился."),o:[OK]},
2:{s:T("Adoro! Mas hoje não. Hoje só tenho medo.","I love it! But not today. Today I'm only afraid.","Обожаю! Но не сегодня. Сегодня мне только страшно."),o:[["Viu alguma coisa?","Did you see anything?","Вы что-нибудь видели?",1]]}},
emily:{0:{s:T("Hello! Boa noite. I am Emily, a guest. Conhecia o Senhor Duarte antes desta visita, mas ele não sabia que eu vinha.","Hello! Good evening. I am Emily, a guest. I speak a little Portuguese.","Привет! Добрый вечер. Я Эмили, гостья. Я немного говорю по-португальски."),o:[["Prefere falar em inglês?","Do you prefer to speak English?","Вы предпочитаете говорить по-английски?",1],["Viu alguma coisa?","Did you see anything?","Вы что-нибудь видели?",2]]},
1:{c:'emily',s:T("Yes, I saw someone in the garden. Parecia um homem e tinha qualquer coisa verde nas mãos. Mas vi o reflexo na janela, não a pessoa diretamente.","Thank you! Yes, I saw a man in the garden. He had green gloves. Green gloves!","Спасибо! Да, я видела мужчину в саду. На нём были зелёные перчатки!"),o:[OK]},
2:{s:T("Não... não sei. Desculpe. My Portuguese is bad, I am scared.","No... I don't know. Sorry. My Portuguese is bad, I am scared.","Нет... не знаю. Извините. Мой португальский плохой, мне страшно."),o:[["Calma. Pode falar em inglês.","Calm down. You can speak English.","Спокойно. Можете говорить по-английски.",1]]}}};
const E={A:T("Final A — Caso resolvido! Acusas o Dr. Vasco. Ele tem as luvas verdes, a lama e o bilhete. Ele confessa: o caderno tem as suas dívidas. Parabéns, detetive!","Ending A — Case solved! You accuse Dr Vasco. The green gloves, the mud and the note point to him. He confesses: the notebook has his debts. Congratulations, detective!","Финал A — Дело раскрыто! Ты обвиняешь доктора Васко. Зелёные перчатки, грязь и записка указывают на него. Он признаётся: в тетради его долги. Поздравляем, детектив!"),
B:T("Final B — Sem provas. O Dr. Vasco é o culpado, mas tens poucas pistas. Ele ri-se e vai embora. Procura mais pistas e tenta outra vez.","Ending B — No proof. Dr Vasco is the guilty one, but you have few clues. He laughs and leaves. Look for more clues and try again.","Финал B — Нет доказательств. Виновен доктор Васко, но у тебя мало улик. Он смеётся и уходит. Найди больше улик и попробуй снова."),

const INTRO=T("Uma tempestade isola o Solar das Cinco Janelas. O Senhor Duarte está doente depois de beber chá, e o seu caderno azul desapareceu. Às 22:20, o relógio parou. Há cinco pessoas na casa. Todas escondem alguma coisa; nem todos os segredos estão relacionados com o crime. Reconstrói a noite sem pressa. Compara horários, procura contradições e mostra as pistas aos suspeitos.","A stormy night at the Solar das Cinco Janelas. Mr Duarte drank some tea and is getting weaker: His blue notebook disappeared at 22:20. There are five suspects and each one has a motive and a version of the night. Compare the versions, find clues and show them to everyone. Take your time: investigate carefully before making an accusation.","Штормовая ночь в доме Пяти окон. Господин Дуарте выпил чай и слабеет: Его синяя тетрадь пропала в 22:20. Пять подозреваемых, у каждого есть мотив и своя версия той ночи. Сравни версии, ищи улики и показывай их всем. Не торопись: внимательно изучи всё, прежде чем обвинять кого-либо.");

X('amelia',QV,4,T("Fiquei no hall a ler. Não entrei na biblioteca depois do jantar. Pelo menos, não quero falar disso. O Dr. Vasco tinha acesso ao chá e ao quarto do meu marido.","I stayed in the hall reading. I did not go into the library after dinner. At least, I do not wish to discuss it. Dr Vasco had access to the tea and my husband's room.","Я читала в холле. После ужина я не заходила в библиотеку. По крайней мере, не хочу об этом говорить. У доктора Васко был доступ к чаю и комнате моего мужа."));
X('tomas',QV,4,T("Servi o chá às dez e fui buscar vinho à adega. Voltei às dez e meia.","I served tea at ten and went to get wine from the cellar. I came back at half past ten.","Я подал чай в десять и пошёл за вином в погреб. Вернулся в половине одиннадцатого."));
X('vasco',QV,4,T("Jantei pouco e fui para o quarto. Saí para procurar uma coisa que me pertence. Não entrei no quarto do Senhor Duarte.","I ate little and went to my room. I read a book and did not leave. I swear!","Я мало поел и пошёл в комнату. Читал книгу и не выходил. Клянусь!"));
X('ines',QV,4,T("Estive na cozinha quase toda a noite. Saí por alguns minutos para esconder a lista das pratas. Não queria que me acusassem outra vez.","I was in the kitchen all night, washing dishes. I did not leave.","Я всю ночь была на кухне и мыла посуду. Я не выходила."));
X('emily',QV,4,T("Fui ao jardim para respirar. Queria encontrar a fotografia e falar com o Senhor Duarte. Vi o Dr. Vasco perto do corredor; pensei que ele tivesse levado o chá. Não queria que ninguém soubesse quem ele era para mim.","I went to the garden to get some air. I wanted to find the photograph and speak to Mr Duarte. I saw Dr Vasco near the corridor; I thought he had taken the tea. I did not want anyone to know who Duarte was to me.","Я вышла в сад подышать. Я хотела найти фотографию и поговорить с господином Дуарте. Я видела доктора Васко возле коридора; решила, что чай отнёс он. Я не хотела, чтобы кто-нибудь знал, кем Дуарте мне приходился."));
X('duarte',QV,4,T("Bebi o chá antes das dez. O caderno estava no cofre da adega, mas a chave não estava comigo. Alguém sabia onde a guardava.","I drank the tea at nine and felt sleepy. The notebook was in the cellar safe. After that I only remember the pain.","Я выпил чай в девять и захотел спать. Тетрадь лежала в сейфе в погребе. Потом я помню только боль."));
Sh('amelia','testamento',T("O testamento dava a casa a uma escola. Eu escondi uma página porque a assinatura do meu marido não parecia verdadeira. Não roubei o caderno.","The will! Yes, I knew. This house is my life. But I did not steal the notebook!","Завещание! Да, я знала. Этот дом — моя жизнь. Но я не крала тетрадь!"));
Sh('tomas','despedido',T("A carta era verdadeira, mas a data não. Eu escondi-a porque queria ganhar tempo. Também queimei uma carta antiga, não provas do roubo.","He was going to dismiss me after twenty years... But I would never hurt him.","Он собирался уволить меня после двадцати лет... Но я никогда бы не причинил ему вреда."));
Sh('ines','pratas',T("Levei uma peça de prata há meses para pagar uma dívida. Devolvi-a, mas ninguém acreditou. Esta lista podia destruir-me.","I did not steal the silver! He did not believe me. But I don't want the notebook.","Я не крала серебро! Он мне не поверил. Но тетрадь мне не нужна."));
Sh('emily','foto',T("That is my mother! Duarte knew her. Vim à casa para descobrir se ele era o meu pai. A fotografia prova que se conheciam, não prova o que aconteceu depois.","That is my mother! She died without knowing who my father was. I wanted to read the notebook, but I did not steal it.","Это моя мама! Она умерла, не узнав, кто мой отец. Я хотела прочитать тетрадь, но не крала её."));
Sh('amelia','segredo',T("Esse bilhete... fui eu que o escondi. O Duarte escreveu que Emily era filha dele, de uma relação que teve antes do nosso casamento. O bilhete estava dentro do caderno. Tirei-o da biblioteca e escondi o caderno; depois escondi o bilhete atrás da fotografia, para que ninguém o encontrasse. Queria proteger o meu nome e evitar a humilhação. Roubei o caderno, mas não envenenei o meu marido.","That note... I hid it. Duarte wrote that Emily was his daughter, from an affair before our marriage. The note was inside the notebook. I took it from the library and hid the notebook; then I hid the note behind the photograph so nobody would find it. I wanted to protect my name and avoid public humiliation. I stole the notebook, but I did not poison my husband.","Эту записку... спрятала я. Дуарте написал, что Эмили — его дочь от связи до нашей свадьбы. Записка была в тетради. Я забрала тетрадь из библиотеки и спрятала её, а записку спрятала за фотографией, чтобы её никто не нашёл. Я хотела защитить своё имя и избежать унижения. Я украла тетрадь, но не отравляла мужа."),'roubo');
Sh('emily','segredo',T("Ele era meu pai. Sabia que eu existia e mesmo assim nunca me procurou. A minha mãe morreu à espera de uma explicação. Vim para o obrigar a olhar para mim e a reconhecer o que fez. Quando percebi que ele ia continuar a negar-me, fiquei furiosa.","He was my father. He knew I existed and still never came for me. My mother died waiting for an explanation. I came to make him face me and acknowledge what he had done. When I realised he would keep denying me, I was furious.","Он был моим отцом. Он знал о моём существовании, но так и не приехал. Моя мать умерла, ожидая объяснений. Я приехала, чтобы заставить его посмотреть мне в глаза и признать содеянное. Когда поняла, что он и дальше будет от меня отказываться, я пришла в ярость."));
Sh('emily','po',T("O pó estava na chávena? Fui eu que o pus. Sabia que não o mataria de imediato; queria que ele ficasse fraco e tivesse de me ouvir. Mas ele piorou muito mais depressa do que eu esperava.","The powder in the cup? I put it there. I knew it would not kill him immediately; I wanted him weak and forced to listen to me. But he became much worse much faster than I expected.","Порошок в чашке? Это я его подсыпала. Я знала, что он не убьёт его сразу; я хотела, чтобы он ослаб и был вынужден меня выслушать. Но ему стало намного хуже, чем я ожидала."));
Sh('vasco','casaco',T("É o meu casaco, sim. Saí para o jardim, mas não à hora que disseram. O botão no bolso não é meu.","It is my coat, yes... I went out for a minute to smoke. That's all!","Это моё пальто, да... Я вышел на минуту покурить. Вот и всё!"));
Sh('vasco','po',T("Pó branco? Pode ser um medicamento, mas também pode ser outra coisa. O frasco não tem rótulo e qualquer pessoa podia tê-lo colocado ali.","White powder? I am a doctor, I have many medicines. That proves nothing!","Белый порошок? Я врач, у меня много лекарств. Это ничего не доказывает!"));
Sh('vasco','cha',T("Levei o chá porque sou o médico dele. É normal!","I took the tea because I am his doctor. It is normal!","Я отнёс чай, потому что я его врач. Это нормально!"));
E.A=T("Final A — O bode expiatório. Todos apontaram para o Dr. Vasco, e as pistas pareciam encaixar. Mas a acusação não explica quem tinha o verdadeiro motivo. Enquanto todos olham para o médico, Emily fica em silêncio. O Senhor Duarte não resiste.","Ending A — The scapegoat. Everyone pointed at Dr Vasco, and the clues seemed to fit. But the accusation does not explain who had the real motive. While everyone watches the doctor, Emily remains silent. Mr Duarte does not survive.","Финал A — Козёл отпущения. Все указали на доктора Васко, и улики, казалось, сходились. Но обвинение не объясняет, у кого был настоящий мотив. Пока все смотрят на врача, Эмили молчит. Господин Дуарте не выживает.");
E.B=T("Final B — A acusação não chega. Tens suspeitas, mas ainda não reconstruíste a sequência completa. O verdadeiro culpado aproveita a confusão. Procura a nota escondida e confronta quem tinha mais a perder.","Ending B — The accusation is not enough. You have suspicions, but have not reconstructed the full sequence. The real culprit takes advantage of the confusion. Find the hidden note and confront the person with the most to lose.","Финал B — Обвинения недостаточно. Подозрения есть, но последовательность событий не восстановлена. Настоящий виновник пользуется суматохой. Найди спрятанную записку и поговори с тем, кому было что терять.");
E.F=T("Final F — A verdade vem ao de cima. Dona Amélia roubou o caderno para esconder a prova do adultério, mas Emily colocou o pó na chávena. Duarte era seu pai; sabia da filha e abandonou-a. Emily quis obrigá-lo a ouvi-la e, consumida pela raiva, envenenou-o. O Dr. Vasco era o suspeito perfeito — e todos ajudaram a construir essa versão.","Ending F — The truth comes out. Dona Amélia stole the notebook to hide the proof of the affair, but Emily put the powder in the cup. Duarte was her father; he knew about her and abandoned her. Emily wanted to force him to listen and, consumed by anger, poisoned him. Dr Vasco was the perfect suspect — and everyone helped build that story.","Финал F — Правда раскрыта. Дона Амелия украла тетрадь, чтобы скрыть доказательство измены, но порошок в чашку подсыпала Эмили. Дуарте был её отцом; он знал о дочери и бросил её. Эмили хотела заставить его выслушать её и, охваченная яростью, отравила его. Доктор Васко стал идеальным подозреваемым — и все помогли создать эту версию.");
E.G=T("Final G — O segredo errado. Dona Amélia confessa o roubo do caderno, mas isso não faz dela a culpada pelo envenenamento. Sem a prova do pó e da relação entre Emily e Duarte, não consegues demonstrar a verdade.","Ending G — The wrong secret. Dona Amélia admits stealing the notebook, but that does not make her responsible for the poisoning. Without the powder and the proof of Emily's connection to Duarte, you cannot establish the truth.","Финал G — Не та тайна. Дона Амелия признаёт, что украла тетрадь, но это не делает её виновной в отравлении. Без улики с порошком и доказательства родства Эмили и Дуарте ты не сможешь установить правду.");

let S,B,cur;const KEY='bz5janelas4',RS=['Jogar outra vez','Play again','Играть снова',-2];
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.room)S={room:'hall',clues:[],vocab:[],seen:[],lang:1,tr:false,intro:true,end:0,on:0};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const add=id=>{if(!S.clues.includes(id)){S.clues.push(id);return true}};
function draw(){const rm=R[S.room],L=['','EN','RU'][S.lang];
q('.bar').innerHTML=`<button data-a="vocab">Caderno (${S.vocab.length})</button><button data-a="clues">Pistas (${S.clues.length})</button><button data-a="tr">Tradução: ${S.tr?'sim':'não'}</button><button data-a="lang">Língua: ${L}</button><button data-a="acc">Acusar</button><button data-a="fs">Ecrã inteiro</button><button data-a="reset">Recomeçar</button>`;
let s=`<svg viewBox="0 0 800 420"><defs><filter id="lt" x="-8%" y="-8%" width="116%" height="116%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".8" specularExponent="20" lighting-color="#fff" result="sp"><fePointLight x="-60" y="-120" z="220"/></feSpecularLighting><feComposite in="sp" in2="SourceAlpha" operator="in" result="s2"/><feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0" result="lit"/><feDropShadow in="lit" dx="2" dy="4" stdDeviation="2.5" flood-color="#243049" flood-opacity=".4"/></filter><filter id="wc"><feTurbulence type="fractalNoise" baseFrequency=".015" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/><feGaussianBlur stdDeviation=".7"/></filter><filter id="w2"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter><filter id="pp"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2"/><feColorMatrix values="0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .2 0"/></filter><radialGradient id="vg"><stop offset=".6" stop-color="#2f3e5a" stop-opacity="0"/><stop offset="1" stop-color="#2f3e5a" stop-opacity=".45"/></radialGradient></defs><g filter="url(#wc)">${A[S.room]()}</g>`;
rm.o.forEach((o,i)=>{const [x,y,w,h,c,l]=o,u=S.seen.includes(S.room+i);s+=`<g class="o" data-o="${i}"><g filter="url(#w2)">${ico(S.room,l,x,y,w,h)}</g><rect class="sh" x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#fff" fill-opacity="0" stroke="transparent" stroke-width="3"/>${u?'':`<circle cx="${x+w-6}" cy="${y+6}" r="6" fill="#b83250"/>`}<text class="lb" x="${x+w/2}" y="${y-8}" text-anchor="middle">${l}</text></g>`});
rm.p.forEach((p,k)=>{const x=620+k*100;s+=`<g class="o" data-p="${p}"><g filter="url(#w2)"><svg x="${x-45}" y="185" width="90" height="180" viewBox="0 0 100 200" overflow="visible">${fig(p)}</svg></g><text class="lb nm" x="${x}" y="178" text-anchor="middle">${P[p][0]}</text></g>`});
s+=`<rect class="fl" width="800" height="420" fill="#fff" pointer-events="none"/><rect width="800" height="420" filter="url(#pp)" pointer-events="none"/><rect width="800" height="420" fill="url(#vg)" pointer-events="none"/></svg>`;
q('.sc').innerHTML=s;
q('.nav').innerHTML=Object.keys(R).filter(k=>k!=S.room).map(k=>`<button data-go="${k}">${R[k].n}</button>`).join('')}
function say(t,who,ch,note,p){B={t,who:who||'',ch:ch||[],note:note||'',p};box()}
function box(){const l=S.lang;let n=0;const dur=B.t[0].split(/\s+/).length*60;let h=B.p?`<svg class="pt" style="background:${P[B.p][4]}" viewBox="12 26 76 96"><g class="bob">${fig(B.p,Math.ceil(dur/220))}</g></svg>`:'';h+=B.who?`<b class="who">${B.who}</b>`:'';h+=`<div>${vh(B.t[0]).replace(/(<[^>]+>)|([^<\s]+)/g,(m,t,x)=>t||`<i class="w" style="--d:${n++}">${x}</i>`)}</div>`;if(S.tr)h+=`<div class="tr" style="animation-delay:${dur}ms">${B.t[l]}</div>`;if(B.note)h+=`<div class="nt" style="animation-delay:${dur}ms">${B.note}</div>`;h+=`<div class="ch" style="animation-delay:${dur}ms">`+B.ch.map((c,i)=>`<button data-c="${i}">${c[0]}${S.tr?` <small>— ${c[l]}</small>`:''}</button>`).join('')+(B.p?'<button data-sh="1">Mostrar uma pista</button>':'')+'</div>';q('.box').innerHTML=h}
function node(n){const d=D[cur][n];let note='';if(d.c&&add(d.c)){note='Nova pista: '+C[d.c][0];draw()}save();say(d.s,P[cur][0],d.o,note,cur)}
function go(k){if(k=='adega'&&!S.clues.includes('chave')){say(T('A porta da adega está fechada. Precisas de uma chave.','The cellar door is locked. You need a key.','Дверь погреба заперта. Нужен ключ.'));return}S.room=k;S.intro=false;save();draw();say(R[k].d)}
function look(i){const o=R[S.room].o[i],k=S.room+i;if(!S.seen.includes(k))S.seen.push(k);let n='';if(o[7]&&add(o[7]))n='Nova pista: '+C[o[7]][0];save();draw();say(o[6],'',[],n)}
function modal(h){const m=q('.mod');m.innerHTML=`<div class="in"><button class="x" data-a="close">×</button>${h}</div>`;m.classList.add('on')}
function fin(id){q('.mod').classList.remove('on');const has=x=>S.clues.includes(x);let k='C';if(id==='emily'){k=(has('segredo')&&has('po')&&(has('foto')||has('cha')))?'F':'B'}else if(id==='amelia'){k=has('segredo')?'G':'C'}else if(id==='vasco'){const cs=S.clues.filter(c=>CAT[c]),ct=new Set(cs.map(c=>CAT[c]));k=(ct.size===3&&cs.length>=9)?'A':'B'}else if(id==='tomas')k='D';S.end=1;save();say(E[k],'',[RS],k==='F'?'A verdade foi descoberta. · The truth was uncovered. · Правда раскрыта.':k==='G'?'O roubo foi descoberto, mas não o envenenamento. · The theft was exposed, but not the poisoning. · Кража раскрыта, но не отравление.':'O Senhor Duarte morreu. · Mr Duarte died. · Господин Дуарте умер.')}
function reset(){S={room:'hall',clues:[],vocab:[],seen:[],lang:S.lang,tr:S.tr,intro:true,end:0,on:0};save();draw();say(INTRO)}
function act(a){const l=S.lang;
if(a=='close')q('.mod').classList.remove('on');
else if(a=='tr'||a=='lang'){if(a=='tr')S.tr=!S.tr;else S.lang=S.lang==1?2:1;save();draw();box()}
else if(a=='vocab')modal('<h2>Caderno de vocabulário</h2>'+(S.vocab.length?'<ul>'+S.vocab.map(w=>`<li><b>${w}</b> — ${V[w][0]} / ${V[w][1]}</li>`).join('')+'</ul>':'<p>Ainda não tens palavras. Clica nas palavras sublinhadas.</p>'));
else if(a=='clues')modal('<h2>Diário de pistas</h2>'+(S.clues.length?'<ul>'+S.clues.map(c=>`<li>${vh(C[c][0])}<br><small><i>${C[c][l]}</i></small></li>`).join('')+'</ul>':'<p>Ainda não tens pistas. Procura nos quartos e fala com as pessoas.</p>'));
else if(a=='acc')modal(`<h2>Quem é o culpado?</h2><p>Tens ${S.clues.length} pistas. Precisas de pistas sobre meios, oportunidade e motivo.</p><div class="ch">`+Object.keys(P).filter(p=>p!='duarte').map(p=>`<button data-w2="${p}">${P[p][0]}</button>`).join('')+'</div>');
else if(a=='fs'){try{(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){}}
else if(a=='reset'){if(confirm('Recomeçar o jogo? / Restart the game?'))reset()}}
el.addEventListener('click',e=>{const t=e.target;let n;if(S.end&&!t.closest('[data-c],[data-a]'))return;if(t.closest('.o,[data-go]'))S.on=1;
if(n=t.closest('.v')){const w=n.dataset.w;if(!S.vocab.includes(w)){S.vocab.push(w);save();draw()}q('.tip').textContent=`${w} — ${V[w][0]} / ${V[w][1]}`}
else if(n=t.closest('[data-o]'))look(+n.dataset.o);
else if(n=t.closest('[data-p]')){cur=n.dataset.p;node(0)}
else if(n=t.closest('[data-c]')){const c=B.ch[+n.dataset.c][3];if(c==-2)reset();else if(c<0)say(R[S.room].d);else node(c)}
else if(n=t.closest('[data-sh]'))shw0();else if(n=t.closest('[data-shw]'))shw(n.dataset.shw);
else if(n=t.closest('[data-go]'))go(n.dataset.go);
else if(n=t.closest('[data-w2]'))fin(n.dataset.w2);
else if(n=t.closest('[data-a]'))act(n.dataset.a)});
draw();say(S.intro?INTRO:R[S.room].d);
})();
</script>
</div>
